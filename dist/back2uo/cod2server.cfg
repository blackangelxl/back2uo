////////////////////////////
///**********************///
//** COD2 Server CONFIG **//
///**********************///
////////////////////////////


///////////////////////
// Server Indication //
///////////////////////

// Server Name
seta sv_hostname "Back2Uo v.2.1 Server"

// Owner Info
sets _Admin ""
sets _CoAdmin ""
sets _Email ""
sets _Website ""
sets _Location ""

// Mod Infos
sets _Mod "Back2Uo Mod v.2.1"
sets _ModVer "2.1"


//////////////////////
// Server Passwords //
//////////////////////

// Server Password
set g_password "" 

// Rcon Password
set rcon_password "rcon" 

// Private Slots Password 
set sv_privatePassword ""


/////////////////////
// Server Settings //
/////////////////////

// Server
set net_ip ""
set net_port ""
set sv_minPing ""
set sv_maxPing ""
set sv_maxRate "20000"
set com_hunkMegs "512"

// Client
set g_antilag "1"
set sv_fps "20"
set scr_friendlyfire "0" // ( 0 - off | 1 - on | 2 - reflect damage | 3 - Shared )
set scr_teambalance "1" 
set g_deadChat "1"

// Killcam
set scr_killcam "1"
set scr_freelook "0" 
set scr_spectateenemy "1"
set g_forceteamspectate "0" 
set scr_spectatefree "0"


////////////////////////////
// Master Server Settings //
////////////////////////////

// Masterserver
set sv_master0 "cod2master.activision.com"
set sv_master1 "cod2authorize.activision.com"
set sv_master2 "master0.gamespy.com"
set sv_master3 "master1.gamespy.com"
set sv_master4 ""


/////////////////////
// Player Settings //
/////////////////////

// Player Count
set sv_maxclients "24"
set sv_privateclients "0"

// Voice
set sv_voice "0"
set sv_voiceQuality "1" 
set g_voiceChatTalkingDuration "500"
set voice_deadChat "0"
set voice_global "0"
set voice_localEcho "0"


/////////////////////////
// Anti Cheat Settings //
/////////////////////////

// Anti Cheats 
set sv_disableClientConsole "0"
set cl_autocmd "1"
set sv_cheats "1"
set sv_pure "1"
set sv_kickBanTime "10" 
set g_banIPs ""
set sv_floodProtect "0"
set sv_reconnectlimit "3"

// Punkbuster
set sv_punkbuster "1"
set pb_sv_disable


///////////////////////
// Log Data Settings //
///////////////////////

// Log Allow
set logfile "1"
set g_logsync "1" // ( 0 = no log, 1 = buffered, 2 = continuous, 3 = append )

// Log File
set g_log "games_mp.log"


///////////////////////////////////
// Download Settings             //
// ----------------------------- //
// (0 = to forbid, 1 = to allow) //
///////////////////////////////////

// Download Allow
set sv_allowDownload "1"

// Download Clients
set sv_wwwDownload "0"
set sv_wwwBaseURL "http://www.domain.de/cod2"
set sv_wwwDlDisconnected "1"


///////////////////////////////////
// Vote - Client & Map allow     //
// ----------------------------- //
// (0 = to forbid, 1 = to allow) //
///////////////////////////////////

// Vote 
set g_allowvote "1"

// Client Vote
set g_allowvotetempbanuser "1" 
set g_allowvotetempbanclient "0" 
set g_allowvotekick "1" 
set g_allowvoteclientkick "0" 

// Map Vote
set g_allowvotegametype "1" 
set g_allowvotetypemap "1" 
set g_allowvotemap "1" 
set g_allowvotemaprotate "1" 
set g_allowvotemaprestart "1" 


///////////////////////////////////
// Weapons in the Game allow     //
// ----------------------------- //
// (0 = to forbid, 1 = to allow) //
///////////////////////////////////

// Ammo Pools
set g_weaponAmmoPools "0"

// Sniper:
set scr_allow_springfield "1"
set scr_allow_svt40 "1"
set scr_allow_kar98ksniper "1"
set scr_allow_nagantsniper "1"
set scr_allow_enfieldsniper "1"

// Rifle:
set scr_allow_enfield "1"
set scr_allow_kar98k "1"
set scr_allow_m1carbine "1"
set scr_allow_m1garand "1"
set scr_allow_g43 "1"
set scr_allow_nagant "1"

// MG:
set scr_allow_bar "1"
set scr_allow_bren "1"
set scr_allow_mp44 "1"
set scr_allow_ppsh "1"
set scr_allow_mp40 "1"
set scr_allow_sten "1"
set scr_allow_thompson "1"
set scr_allow_pps42 ""
set scr_allow_greasegun ""

// Shotgun:
set scr_allow_shotgun "1"

// Grenades:
set scr_allow_smokegrenades "1"
set scr_allow_fraggrenades "1"


///////////////////////
// Gametype Settings //
///////////////////////

// Deathmatch 
set scr_dm_scorelimit "50" 
set scr_dm_timelimit "20" 

// Team Deathmatch
set scr_tdm_scorelimit "100" 
scr_tdm_timelimit "20" 

// Search & Destroy 
set scr_sd_graceperiod "15" 
set scr_sd_roundlength "4" 
set scr_sd_roundlimit "7" 
set scr_sd_scorelimit "7" 
set scr_sd_timelimit "20" 
set scr_sd_bombtimer "60" 

// Capture the Flag
set scr_ctf_scorelimit "7" 
set scr_ctf_timelimit "20" 

// Headquarder 
set scr_hq_scorelimit "500" 
set scr_hq_timelimit "20"


///////////////////////////////////
// Gametype Settings          //
// ----------------------------- //
// Deathmatch          = "dm"    //
// Team Death Match    = "tdm"   //
// Search and Destroy  = "sd"    //
// Headquaters         = "hq"    //
// Capture the Flag    = "ctf"   // 
///////////////////////////////////

// Gametype
set g_gametype "tdm"


/////////////////
// Config Load //
/////////////////

// Back2Uo v.2.1 Config
exec back2uomod.cfg

// Maps - Rotation
exec maprotation.cfg

