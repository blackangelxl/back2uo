////////////////////////////
///**********************///
///** COD2 Server CONFIG **//
///**********************///
////////////////////////////

///////////////////////
// Server Indication //
///////////////////////

// Server name
seta sv_hostname "Back2Uo v.2.1 Server" // Server name; any text

// Administrator information
sets _Admin ""                      // Admin name; any text
sets _CoAdmin ""                    // Co-admin name; any text
sets _Email ""                      // Contact email address
sets _Website ""                    // Website URL
sets _Location ""                   // Server location or country

// Mod information
sets _Mod "Back2Uo Mod v.2.1 Rebuild"   // Mod name
sets _ModVer "2.1"                      // Mod version

set scr_motd "Welcome to Back2Uo v.2.1" // Message of the day; mod-dependent

//////////////////////
// Server Passwords //
//////////////////////

set g_password ""                   // Server password: "" = public, text = password protected
set rcon_password "rcon"            // RCON password; use a strong, unique password
set sv_privatePassword ""           // Password for private player slots

/////////////////////
// Server Settings //
/////////////////////

set sv_minPing "0"                  // Minimum client ping; 0 = no minimum
set sv_maxPing "0"                  // Maximum client ping; 0 = no maximum
set sv_maxRate "25000"              // Maximum client data rate; depends on available bandwidth
set com_hunkMegs "512"              // Memory allocation in MB; depends on build and available RAM

set developer "1"                   // Debug output: 0 = off, 1 = on; other values are build-dependent
set sv_gamespy "1"                  // GameSpy listing: 0 = off, 1 = on; only if supported
set sv_dl_maxRate "150000"          // Download rate limit in bytes/sec; build-dependent

// Client settings3
set g_antilag "1"                   // Antilag: 0 = off, 1 = on
set sv_fps "20"                     // Server FPS; default = 20, supported values depend on the build
set scr_friendlyfire "0"            // Friendly fire: 0 = off, 1 = on, 2 = reflected, 3 = shared/mod-dependent
set scr_teambalance "1"             // Auto team balance: 0 = off, 1 = on
set g_deadChat "1"                  // Dead player chat: 0 = off, 1 = on

set sv_invulnerabletime "1"         // Respawn protection time in seconds; 0 = no protection, mod-dependent
set g_teamswitchdelay "5"           // Team switch delay in seconds; 0 = no delay
set scr_forcerespawn "1"            // Force respawn in DM/TDM: 0 = off, 1 = on; mod-dependent
set scr_drawfriend "0"              // Draw teammate icons: 0 = off, 1 = on; mod-dependent

// Killcam and spectating
set scr_killcam "1"                 // Killcam: 0 = off, 1 = on
set scr_freelook "0"                // Free spectator camera: 0 = off, 1 = on; build-dependent
set scr_spectateenemy "1"           // Allow spectating enemies: 0 = off, 1 = on
set g_forceteamspectate "0"         // Force team-only spectating: 0 = off, 1 = on
set scr_spectatefree "0"            // Allow free spectating: 0 = off, 1 = on

/////////////////////
// Player Settings //
/////////////////////

set sv_maxclients "16"              // Maximum player count; depends on server capacity
set sv_privateclients "0"           // Number of reserved slots; 0 to sv_maxclients

// Voice chat
set sv_voice "0"                        // Voice chat: 0 = off, 1 = on
set sv_voiceQuality "1"                 // Voice quality; normally 1 to 9
set g_voiceChatTalkingDuration "500"    // Voice indicator duration in ms; mod-dependent
set voice_deadChat "0"                  // Dead player voice chat: 0 = off, 1 = on; mod-dependent
set voice_global "0"                    // Global voice chat: 0 = off, 1 = on; mod-dependent
set voice_localEcho "0"                 // Local voice echo: 0 = off, 1 = on; mod-dependent

/////////////////////////
// Anti-Cheat Settings //
/////////////////////////

set sv_disableClientConsole "0"     // Client console: 0 = enabled, 1 = disabled
set cl_autocmd "1"                  // Mod/client-specific setting; verify its meaning and values
set sv_cheats "0"                   // Cheats: 0 = off, 1 = on
set sv_pure "0"                     // File verification: 0 = off, 1 = on
set sv_kickBanTime "10"             // Kick/ban duration; units and behavior depend on the mod
set g_banIPs ""                     // IP ban list; format depends on the mod
set sv_floodProtect "1"             // Chat flood protection: 0 = off, 1 = on
set sv_reconnectlimit "3"           // Limits rapid reconnects; exact behavior is build-dependent
set sv_punkbuster "0"               // PunkBuster: 0 = off, 1 = on; CoD2 PunkBuster is discontinued

///////////////////////
// Log Data Settings //
///////////////////////

// Logging
set logfile "1"                     // Logging: 0 = off, 1 = on
set g_logsync "1"                   // Log mode: 0 = direct write, 1 = buffered; other values are build-dependent
set g_log "games_mp.log"            // Multiplayer log filename

///////////////////////////////////
// Download Settings             //
// 0 = disabled, 1 = enabled     //
///////////////////////////////////

// Server downloads
set sv_allowDownload "1"            // Download files from the game server: 0 = off, 1 = on

// HTTP downloads
set sv_wwwDownload "0"              // Web downloads: 0 = off, 1 = on
set sv_wwwBaseURL "http://www.domain.de/cod2"   // Base URL; requires a configured web server
set sv_wwwDlDisconnected "1"        // Allow downloads after disconnect/map rotation: 0 = off, 1 = on

///////////////////////////////////
// Voting Settings               //
///////////////////////////////////

set g_allowvote "1"                 // Enable voting: 0 = off, 1 = on
set scr_allow_vote "1"              // Additional vote control: 0 = off, 1 = on; mod-dependent
set g_oldvoting "1"                 // Legacy voting system: 0 = off, 1 = on; mod-dependent

// Player votes
set g_allowvotetempbanuser "1"      // Temporary user ban vote: 0 = off, 1 = on; mod-dependent
set g_allowvotetempbanclient "0"    // Temporary client ban vote: 0 = off, 1 = on; mod-dependent
set g_allowvotekick "1"             // Kick vote: 0 = off, 1 = on
set g_allowvoteclientkick "0"       // Client kick vote: 0 = off, 1 = on; mod-dependent

// Map and game type votes
set g_allowvotegametype "1"         // Change game type by vote: 0 = off, 1 = on
set g_allowvotetypemap "1"          // Vote for a game type/map combination: 0 = off, 1 = on
set g_allowvotemap "1"              // Change map by vote: 0 = off, 1 = on
set g_allowvotemaprotate "1"        // Change map rotation by vote: 0 = off, 1 = on
set g_allowvotemaprestart "1"       // Restart map by vote: 0 = off, 1 = on

///////////////////////
// Teamkill Settings //
///////////////////////

set g_teamkillwarn "3"              // Teamkill warning threshold; behavior depends on the mod
set g_teamkillkick "3"              // Teamkill kick threshold; behavior depends on the mod

///////////////////////////////////
// Weapon Settings               //
// 0 = disabled, 1 = enabled     //
///////////////////////////////////

// Ammo pools
set g_weaponAmmoPools "0"           // Shared ammo pools: 0 = off, 1 = on; mod-dependent

// Sniper rifles
set scr_allow_springfield "1"       // Springfield: 0 = disabled, 1 = enabled
set scr_allow_svt40 "1"             // SVT-40: 0 = disabled, 1 = enabled
set scr_allow_kar98ksniper "1"      // Kar98k Sniper: 0 = disabled, 1 = enabled
set scr_allow_nagantsniper "1"      // Nagant Sniper: 0 = disabled, 1 = enabled
set scr_allow_enfieldsniper "1"     // Enfield Sniper: 0 = disabled, 1 = enabled

// Rifles
set scr_allow_enfield "1"           // Enfield: 0 = disabled, 1 = enabled
set scr_allow_kar98k "1"            // Kar98k: 0 = disabled, 1 = enabled
set scr_allow_m1carbine "1"          // M1 Carbine: 0 = disabled, 1 = enabled
set scr_allow_m1garand "1"          // M1 Garand: 0 = disabled, 1 = enabled
set scr_allow_g43 "1"               // Gewehr 43: 0 = disabled, 1 = enabled
set scr_allow_nagant "1"            // Nagant: 0 = disabled, 1 = enabled

// Machine guns and submachine guns
set scr_allow_bar "1"               // BAR: 0 = disabled, 1 = enabled
set scr_allow_bren "1"              // Bren: 0 = disabled, 1 = enabled
set scr_allow_mp44 "1"              // MP44: 0 = disabled, 1 = enabled
set scr_allow_ppsh "1"              // PPSH: 0 = disabled, 1 = enabled
set scr_allow_mp40 "1"              // MP40: 0 = disabled, 1 = enabled
set scr_allow_sten "1"              // Sten: 0 = disabled, 1 = enabled
set scr_allow_thompson "1"          // Thompson: 0 = disabled, 1 = enabled
set scr_allow_pps42 "1"             // PPS-42: 0 = disabled, 1 = enabled
set scr_allow_greasegun "1"         // Grease Gun: 0 = disabled, 1 = enabled

// Shotguns
set scr_allow_shotgun_allies "1"    // Allied shotgun: 0 = disabled, 1 = enabled
set scr_allow_shotgun_axis "1"      // Axis shotgun: 0 = disabled, 1 = enabled

// Grenades
set scr_allow_smokegrenades "1"     // Smoke grenades: 0 = disabled, 1 = enabled
set scr_allow_fraggrenades "1"      // Fragmentation grenades: 0 = disabled, 1 = enabled

///////////////////////
// Game Type Settings //
///////////////////////

// Deathmatch
set scr_dm_scorelimit "50"          // Score limit; positive number, 0 may mean unlimited
set scr_dm_timelimit "20"           // Time limit in minutes; 0 often means unlimited

// Team Deathmatch
set scr_tdm_scorelimit "100"        // Score limit; positive number, 0 is mod-dependent
set scr_tdm_timelimit "20"          // Time limit in minutes; 0 often means unlimited

// Search and Destroy
set scr_sd_graceperiod "15"         / Preparation time in seconds
set scr_sd_roundlength "4"          // Round duration in minutes
set scr_sd_roundlimit "7"           // Round limit; 0 may mean unlimited, mod-dependent
set scr_sd_scorelimit "7"           // Required score/round wins; verify mod behavior
set scr_sd_timelimit "20"           // Time limit in minutes
set scr_sd_bombtimer "60"           // Bomb timer in seconds

// Capture the Flag
set scr_ctf_scorelimit "7"          // Score limit; positive number
set scr_ctf_timelimit "20"          // Time limit in minutes

// Headquarters
set scr_hq_scorelimit "500"         // Score limit; positive number
set scr_hq_timelimit "20"           // Time limit in minutes

///////////////////////
// Game Type Selection //
///////////////////////

// Standard game types: dm, tdm, sd, hq, ctf
set g_gametype "tdm"                // Active game type: dm / tdm / sd / hq / ctf

/////////////////
// Config Load //
/////////////////

exec zk_libcod.cfg                  // Load libcod settings
exec back2uomod.cfg                 // Load Back2Uo mod settings
exec maprotation.cfg                // Load the separate map rotation
