//////////////////////////
// Back2Uo Mod Settings //
//////////////////////////

//-Back2Uo Mod Setup-//
set back2uo_status_active "1"           // Back2Uo Mod Active Status ( 0 = Off | 1 = On || Recommended = 1 )

//-Debug-//
set back2uo_development "0"             // Development Test Functions ( 0 = Off | 1 = On || Recommended = 0 )
set back2uo_logprint "0"                // Server Log ( 0 = Off | 1 = Events with values "B2U;..." | 2 = Events + function trace || Recommended = 0 )

//-Admin Commands-//
set back2uo_admin_password ""                           // Admin Password for the Console Commands below ( Empty = Commands Off )
// /openscriptmenu -1 b2u_artillery:<password>          // Player Console: Grants one Artillery Strike to yourself ( 3 wrong Passwords = locked for the Map )
// /openscriptmenu -1 b2u_airplanes:<count>:<password>  // Player Console: Starts one Airplane Fly-over ( 0 = Count from back2uo_airplanes_max_count | Value = 1 -> 6 )
// /openscriptmenu -1 b2u_mortar:<password>             // Player Console: Starts one Mortar Barrage
// /openscriptmenu -1 b2u_ambtracer:<password>          // Player Console: Starts one Wave of Ambience Anti-Aircraft
// /openscriptmenu -1 b2u_thunderfx:<password>          // Player Console: Plays one Lightning Flash with Thunder
// /openscriptmenu -1 b2u_rainfx:<password>             // Player Console: Rain On/Off for the current Round ( replaces Snow )
// /openscriptmenu -1 b2u_snowfx:<password>             // Player Console: Snow On/Off for the current Round ( replaces Rain )

//-Test Bots-//
set back2uo_testbots_active "1"         // Back2Uo Test Bots Active ( 0 = Off | 1 = On || Recommended = 1 )
set back2uo_testbots "8"                // Back2Uo Test Bots Count ( 0 = Nothing | Value = Count || Recommended = 8 )
set back2uo_testbots_skill "2"          // Back2Uo Test Bots Skill: reaction, aim and turn speed ( 1 = Easy | 2 = Normal | 3 = Hard || Recommended = 2 )

//-Back2Uo Auto Download Info-//
set back2uo_autodownload "1"            // Back2Uo User without Auto Download are kicked ( 0 = Off | 1 = On || Recommended = 1 ) 

//-Back2Uo Client Settings-//
set back2uo_client_settings "1"         // Reset Client Cvars to CoD2 Defaults on Connect: FOV, Damage Icon, Objective Markers ( 0 = Off | 1 = On || Recommended = 1 )

//-Random Map Rotation-//
set back2uo_randommaprotation "0"       // Random Map Rotation ( 0 = Config Map Rotation | 1 = Random Map Rotation || Recommended = 0 )


