////////////////////////////////////////////////////////////
// zk_libcod.cfg
// Additional configuration for zk_libcod / libcod2
//
// Load this file from server.cfg, preferably before other
// variable definitions:
//
//     exec zk_libcod.cfg
//
// Most values below are the upstream zk_libcod defaults and
// are intended to preserve stock Call of Duty 2 behavior.
// Check the documentation for your exact zk_libcod version:
// https://github.com/ibuddieat/zk_libcod/blob/dev/doc/added_dvars.md
////////////////////////////////////////////////////////////


//////////////////////////////
// Console and debug logging //
//////////////////////////////

set con_coloredPrints "1"                   // Colorize ^1, ^2 etc. in server console output.
set g_debugCallbacks "0"                    // Log script callback assignments and calls.
set g_debugEvents "0"                       // Log engine events such as footsteps and temporary entities.
set g_debugGraph "0"                        // Log graph/pathfinding diagnostics.
set g_debugStaticModels "0"                 // Log information about static models when a map loads.
set logErrors "1"                           // Log non-terminal script runtime errors.
set logfileName "console_mp_server.log"     // Console log filename; set before enabling logfile.
set logfileRotate "0"                       // Number of old console log files to keep after restart (0 = no rotation).
set logTimestamps "1"                       // Add timestamps to console log entries.
set g_logPickup "1"                         // Log item pickups in the game log.


/////////////////////////
// File and map loading //
/////////////////////////

set fs_callbacks ""                         // GSC file path (without .gsc) for script callbacks; empty = stock callback setup.
set fs_gametypes ""                         // GSC gametype directory; empty = maps/mp/gametypes.
set fs_library ""                           // Manymaps library path relative to fs_homepath/fs_game; empty = default Library folder.
set fs_mapScriptDirectories "0"             // Map script lookup: 0 = stock path, 1 = nested map folder, 2 = nested first then stock.
set fs_replaceStockMaps "0"                 // Allow manymaps to replace stock-map IWDs when configured.
set loc_loadLocalizedMods "1"               // Also download localized_<language>_*.iwd files from the mod folder.


////////////////////////////////////////
// Collision, movement and projectiles //
////////////////////////////////////////

set g_brushModelCollisionTweaks "0"         // Enable effects of solidForPlayer/notSolidForPlayer script methods.
set g_bulletDrop "1"                        // Enable the optional bullet-gravity system; requires script support.
set g_bulletDropMaxTime "10000"             // Maximum travel time for gravity-enabled bullets, in milliseconds.
set g_corpseHit "1"                         // Enable bullet hit sounds/effects on corpses during the death animation.
set g_droppedWeaponsNeglectBots "0"         // Do not count bots for dropped-weapon cleanup distance while humans are active.
set g_forceUnlink "0"                       // Unlink child entities when SetModel is called on their parent; logs a warning.
set g_mantleBlockEnable "1"                 // Keep the invisible barrier used while a player mantles/climbs.
set g_noMoverBlockage "0"                   // Control whether other entities can block movers such as elevators.
set g_playerCollision "1"                   // Enable player collision (legacy libcod setting).
set g_playerCollisionEjectDamageAllowed "0" // Allow bullet damage while players are being separated from overlap.
set g_playerCollisionEjectDuration "300"    // Duration of player separation after overlap, in milliseconds (50-1000).
set g_playerEject "1"                       // Enable player ejection when players overlap (legacy libcod setting).
set g_pointTraceMovement "0"                // Use point traces rather than the full player bounding box for movement collision.
set g_resetSlide "0"                        // Fix slide-like movement after fall/grenade damage.
set g_sendEmtpyOffhandEvents "1"            // Preserve stock offhand events; disabling prevents grenade-button event suppression.
set g_triggerMode "1"                       // Map damage trigger mode: 0 = disabled, 1 = stock behavior, 2 = experimental fix.
set jump_bounceEnable "0"                   // Enable CoD4-style bounce jumping.
set jump_carryMoverVelocity "0"             // Carry mover/elevator velocity when jumping off a mover.
set net_noFragmentationDelay "0"            // Send all pending network fragments per frame; may improve busy-server lag but adds I/O load.


/////////////////////////
// Precache and entities //
/////////////////////////

set g_reservedModels "0"                    // Reserve model slots for script-precached models (0-255); consider with g_safePrecache.
set g_safePrecache "0"                      // Warn instead of stopping the server if LoadFx/PrecacheModel limits are exceeded.
set g_spawnMapTurrets "1"                   // Spawn map-defined turrets; disabling passes their list to CodeCallback_MapTurretsLoad.
set g_spawnMapWeapons "1"                   // Spawn map-defined weapons; disabling passes their list to CodeCallback_MapWeaponsLoad.
set g_turretMissingTagTerminalError "1"     // Stop on a missing turret tag_player tag; 0 reports a script error instead.
set g_spectateBots "1"                      // Allow players to spectate bots.
set sv_autoAddSnapshotEntities "1"          // Automatically add entities to server snapshots; disabling requires script-managed snapshots.
set sv_maxSnapshotEntities "1024"           // Maximum entities in a snapshot (64-1024); lower values may help legacy clients.


//////////////////////////
// Network and bandwidth //
//////////////////////////

set g_forceRate "0"                         // Force client rate: 0 = disabled; otherwise 1000-25000.
set g_forceSnaps "0"                        // Force client snaps: 0 = disabled; otherwise 1-30.
set sv_fastDownload "1"                     // Experimental faster direct game-server downloads; does not affect HTTP downloads.
set sv_fastDownloadSpeed "8"                // Direct-download speed level 1-8 when sv_fastDownload is enabled.
set sv_downloadRetransmitTimeout "1000"     // Retransmit direct-download blocks after this many milliseconds (250-10000).
set sv_downloadNotifications "0"            // Print requested file paths in-game for direct and HTTP downloads.
set sv_downloadMessageAtMap "1"             // Apply sv_downloadMessage to map-file downloads too.
set sv_downloadMessage ""                   // Optional message shown for download handling; empty = no custom message.
set sv_downloadMessageForLegacyClients ""   // Optional disconnect message for certain legacy clients; empty = disabled.
set sv_wwwDlDisconnectedMessages "1"        // Show download-related disconnect messages (legacy/compatibility setting).


/////////////////////////////
// Connection and security //
/////////////////////////////

set sv_authorizeTimeout "5000"              // Wait for authorize-server response on connect, in milliseconds (0-1200000).
set sv_allowRcon "1"                        // Allow remote-console commands (legacy libcod setting).
set sv_cracked "0"                          // Legacy cracked-server switch; keep disabled unless your build requires otherwise.
set sv_noAuthorize "0"                      // Legacy setting: do not bypass authorization by default.
set sv_verifyIwds "1"                       // Legacy setting: verify client IWD files.
set sv_limitLocalRcon "1"                   // Whitelist internal IP ranges in the RCON rate limiter.
set sv_logRcon "1"                          // Log successful RCON commands.
set sv_logHeartbeats "1"                    // Log master-server heartbeat messages.
set sv_kickMessages "1"                     // Show player kick messages; 0 also overrides bot kick messages.
set sv_botKickMessages "1"                  // Show bot disconnect/kick messages.
set sv_disconnectMessages "1"               // Show ´Game session no longer available´ messages.
set sv_genericServerErrorMessage "1"        // Send clients a generic crash message rather than internal error details.
set sv_kickGamestateLimitedClients "1"      // Kick clients that cannot support the current mod´s gamestate.
set sv_timeoutMessages "1"                  // Show timeout-related messages.
set sv_version "1.3"                        // Protocol version setting; use only if supported by your server build.


//////////////////////////////
// Bot behavior and triggers //
//////////////////////////////

set sv_botReconnectMode "0"                 // Bot map-switch behavior: 0 = stock, 1 = kick on switch, 2 = reconnect in same slot.
set sv_botUseTriggerUse "0"                 // Notify bots when nearby trigger_use/trigger_use_touch prompts appear.
set sv_isLookingAtOnDemand "0"              // Optimize IsLookingAt if it is called infrequently; otherwise leave at 0.
set sv_updateCursorHints "1"                // Update cursor hints (legacy/compatibility setting).


///////////////////////////
// JSON script functions //
///////////////////////////

set scr_json_async_max_jobs "64"            // Maximum simultaneous pending async JSON jobs (1-1024).
set scr_json_max_load_bytes "8388608"       // Maximum JSON load size in bytes (8 MiB; async loading is capped at 32 MiB).
set scr_json_slow_warn_ms "25"              // Warn if a synchronous JSON function takes longer than this many milliseconds.
set scr_turretDamageName "0"                // 0 = stock; 1 = pass turret weapon name to damage callback; 2 also uses hit-location table.


//////////////////////////////
// Pathfinding graph settings //
//////////////////////////////

set sv_graphAstarMaxIterations "0"          // Max nodes expanded per graphFindPath search; 0 = unlimited.
set sv_graphAstarWeight "1.0"               // Weighted A* multiplier: 1.0 = optimal; higher values search faster but may yield longer paths.
set sv_graphMaxGraphs "8"                   // Maximum number of graph objects that can exist simultaneously (1-64).
set sv_graphMaxNodes "8192"                 // Maximum nodes per graph (64-65535).


///////////////////////////////
// Proxy / protocol settings //
///////////////////////////////

set sv_proxiesVisibleForTrackers "0"        // Show proxy clients to server trackers.
set sv_proxyAddress_1_0 "0.0.0.0:28960"     // Listening address for protocol 1.0 proxy; used only when enabled.
set sv_proxyAddress_1_2 "0.0.0.0:28961"     // Listening address for protocol 1.2 proxy; used only when enabled.
set sv_proxyAddress_1_3 "0.0.0.0:28962"     // Listening address for protocol 1.3 proxy; used only when enabled.
set sv_proxyAddress_1_3_119 "0.0.0.0:28963" // Listening address for protocol 1.3/119 proxy; used only when enabled.
set sv_proxyEnable_1_0 "0"                  // Enable protocol 1.0 proxy.
set sv_proxyEnable_1_2 "0"                  // Enable protocol 1.2 proxy.
set sv_proxyEnable_1_3 "0"                  // Enable protocol 1.3 proxy.
set sv_proxyEnable_1_3_119 "0"              // Enable protocol 1.3/119 proxy.
set sv_proxyQueryCacheRefreshTime "1000"    // Proxy query-cache refresh interval in milliseconds.
set sv_proxyTimeout "0"                     // Proxy timeout setting; 0 = upstream default behavior.
set sv_reservedConfigstringBufferSize "0"   // Extra reserved configstring buffer; 0 = default behavior.
set sv_minimizeSysteminfo "0"               // 0 = stock; higher values remove selected dvars from systeminfo to allow more IWDs (read docs carefully).
