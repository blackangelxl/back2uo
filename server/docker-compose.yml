services:
  cod2_server:

    build:
      context: .
      dockerfile: Dockerfile
      args:
        TOMASZ_VERSION: "0.35"
    image: back2uo-cod2-server:local
    container_name: cod2-server
    restart: always
    ports:
      - 28970:28970
      - 28970:28970/udp
    volumes:
      - back2uo:/cod2/back2uo:ro
      - cod2_main:/cod2/main:ro
      #- cod2_library:/cod2/library:ro
    environment:
      PARAMS_BEFORE: "+exec cod2server.cfg"
      COD2_SET_fs_homepath: "/cod2/home"
      COD2_SET_fs_library: "library"
      COD2_SET_fs_game: "back2uo"
      COD2_SET_loc_language: 2
      COD2_SET_dedicated: 1
      COD2_SET_net_ip: "0.0.0.0"
      COD2_SET_net_port: 28970
    stdin_open: true
    tty: true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "10"

volumes:
  back2uo:
    external: true
  cod2_main:
    external: true
  cod2_library:
    external: true
