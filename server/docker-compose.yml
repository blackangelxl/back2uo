services:
  cod2_server:
    # You can chose a different server version, see available image tags:
    # https://hub.docker.com/r/bgauduch/cod2server/tags
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "20500:20500/udp"
      - "20510:20510/udp"
      - "28960:28960/tcp"
      - "28960:28960/udp"
    # Mount required game files
    volumes:
      - ./main:/home/cod2/main:ro
      - ../dist/back2uo:/home/cod2/back2uo:ro
    # Configure server parameters
    #command:
      #[
        #"+set", "dedicated", "1",
        #"+set", "loc_language", "2",
        #"+set", "net_port", "28960",
        #"+set", "sv_cheats", "0",
        #"+set", "sv_punkbuster", "0",
        #"+exec", "punkbuster.cfg",
        #"+exec", "server_mp.cfg"
    # Allow server shell interaction
    stdin_open: true
    tty: true
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
