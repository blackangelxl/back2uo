// Back2Uo test server config, used by tests/run_tests.py (copied into dist-test/back2uo/).
// No map rotation here: run_tests.py sets g_gametype and loads the map on the command line.

set sv_hostname "Back2Uo test"
set rcon_password "b2utest"
set sv_maxclients "8"
set sv_punkbuster "0"
set sv_cheats "0"
set sv_pure "1"
set sv_allowDownload "0"
set com_hunkMegs "512"

// Developer output: shows script runtime errors and println() lines in the console
set developer "1"
set developer_script "1"

set logfile "1"
set g_logsync "2"
set g_log "games_mp.log"

// Mod settings as in the release
exec back2uomod.cfg

// Turn on the GSC test runner (tests/gsc/back2uo/_back2uo_test.gsc)
set back2uo_test "1"
